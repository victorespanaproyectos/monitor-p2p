name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p2p
          POSTGRES_USER: p2p
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U p2p" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: p2p
      DB_USER: p2p
      DB_PASSWORD: test-only-password
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test p2p
